services:
  - type: web
    name: transaction-risk-review
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: REVIEWER_TOKEN
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_INIT_MODE
        value: never
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
